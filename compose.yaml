# Kener — status page for seed-vm-services-linux-eastus.
#
# Published at https://uptime.seedaps.com through the Cloudflare Tunnel
# (ingress -> http://localhost:3001), and on the Azure VNet at
# http://172.17.0.5:3001. It took both over from Gatus on 2026-09-14 by binding
# the same host port.
#
# Kener has NO whole-site authentication and no basic-auth option: the admin UI
# and the API are gated, the status page is not. This board is therefore
# PUBLICLY READABLE - all 46 monitors, their hostnames and their history - which
# is a deliberate, accepted decision (ADR-0010), not an oversight. Gatus, which
# it replaced, was behind basic auth. Putting Cloudflare Access in front of the
# hostname is how that would be undone.
#
# Deploy: /opt/stacks/vm-services/deploy.sh /opt/stacks/kener (no Komodo).
name: kener

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # The application. Runs its Knex migrations in-process at startup, so there is
  # no init container.
  kener:
    # 4.1.9+ is mandatory: 4.0.0-4.1.8 let a percent-encoded path
    # (/%61pi/v4/...) reach every /api/v4 route without an API key (CVSS 9.1).
    image: rajnandan1/kener:4.1.11
    restart: unless-stopped
    init: true
    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 256m
    pids_limit: 512

    # NOTE: no healthcheck here on purpose. The official image already ships one
    # hitting the plain /healthcheck. Do not point a restart-on-failure check at
    # /healthcheck?strict=1 — restarting Kener cannot fix a dead database, and it
    # would restart-loop for the whole outage. Use ?strict=1 for alerting only.

    environment:
      # From the .env beside this file (mode 600 on the VM), never committed.
      # This repository is public.
      KENER_SECRET_KEY: ${KENER_SECRET_KEY:?missing — set it in .env}
      DATABASE_URL: postgresql://kener:${KENER_DB_PASSWORD:?missing — set it in .env}@postgres:5432/kener

      REDIS_URL: redis://redis:6379
      PORT: "3000"

      # Must match the URL the browser actually uses. SvelteKit rejects every
      # form POST — including login — with "Cross-site POST form submissions are
      # forbidden" if this is wrong. No trailing slash.
      ORIGIN: https://uptime.seedaps.com

    ports:
      # 3001 is inherited from Gatus, deliberately: the Cloudflare Tunnel ingress
      # rule for uptime.seedaps.com already points here.
      - "3001:3000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Dedicated PostgreSQL. Kener's own docs recommend PostgreSQL for production
  # and there is no SQLite -> PostgreSQL migration path, so this is chosen up
  # front.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Sized for a 512 MiB container: shared_buffers at ~25%, few connections
    # (Kener's pool is 10 + 5 workers), and longer checkpoints with compressed
    # WAL to cut writes on the VM's single shared disk.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=1GB
      - -c
      - wal_compression=on
      - -c
      - log_checkpoints=on
    shm_size: 128mb
    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 128m
    pids_limit: 256
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: kener
      POSTGRES_PASSWORD: ${KENER_DB_PASSWORD:?missing — set it in .env}
      POSTGRES_DB: kener
    volumes:
      - kener-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kener -d kener"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Required, not optional: Kener will not start without REDIS_URL. Backs the
  # BullMQ queues that drive checks, alerting and email fan-out.
  #
  # AOF is on because upstream's own self-hosted compose overrides enable it and
  # nothing in the docs states that Redis holds only reconstructible state.
  # maxmemory stays well under the 256m container limit so a fork for the AOF
  # rewrite has room; noeviction is the only policy BullMQ supports.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 256m
    memswap_limit: 256m
    mem_reservation: 64m
    pids_limit: 128
    volumes:
      - kener-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging: *logging

# Neither postgres nor redis publishes a port. Only kener does, because
# cloudflared runs as a systemd service on the VM host rather than as a
# container, so it cannot reach a Docker network by service name.
networks:
  default:
    name: kener_internal

volumes:
  kener-postgres-data:
    name: kener-postgres-data
  kener-redis-data:
    name: kener-redis-data
